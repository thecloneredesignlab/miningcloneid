caption: "Model Parameters and MCTS Initialization Values"
label: "tab:model_params"
footnotesize: true
columns:
  - key: symbol
    header: "\\textbf{Symbol}"
  - key: description
    header: "\\textbf{Parameter Description}"
  - key: value_unit
    header: "\\textbf{Value \\& unit}"
rows:
  - symbol: "$D$"
    description: "Beam search horizon (depth)"
    value_unit: "2 years"
  - symbol: "$T$"
    description: "Total therapeutic cycles for the treatment plan"
    value_unit: "100 cycles"
  - symbol: "$\\Delta t_{\\text{switch}}$"
    description: "Duration of each treatment cycle"
    value_unit: "7--28 days"
  - symbol: "$\\theta_{\\min}$"
    description: "Extinction threshold (minimum viable population)"
    value_unit: "$1 \\times 10^5$ cells"
  - symbol: "$\\theta_{\\max}$"
    description: "Maximum tumor carrying capacity (safety limit)"
    value_unit: "$2 \\times 10^{10}$ cells"
  - symbol: "$\\mathcal{A}$"
    description: "Action space (Available Drugs)"
    value_unit: "\\{Drug $L_1$, Drug $L_2$, Drug $H_1$, Drug $H_2$, Drug $H_3$, Drug $H_4$, None\\}"
  - symbol: "$\\mathbf{p}_0$"
    description: "Initial Ploidy State ($2n, 3n, 4n$ populations)"
    value_unit: "$\\{1.5, 0.3, 0.25\\} \\times 10^9$ cells"
  - symbol: "$num_{beams}$"
    description: "Beam width (number of simulations per action)"
    value_unit: "40"

