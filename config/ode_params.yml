caption: "\\textbf{ODE Model Parameters.} Fixed values represent defaults defined in the function headers, while optimized values are estimated via the differential evolution algorithm."
label: "tab:model_parameters"
columns:
  - key: symbol
    header: "\\textbf{Symbol}"
  - key: code_variable
    header: "\\textbf{Code Variable}"
  - key: description
    header: "\\textbf{Description}"
  - key: value_source
    header: "\\textbf{Value/Source}"
groups:
  - title: "\\textit{State Space \\& Growth Dynamics}"
    rows:
      - symbol: "$N_{\\text{unit}}$"
        code_variable: "\\texttt{N\\_unit}"
        description: "Baseline chromosome count corresponding to Ploidy $P=1$."
        value_source: "22 (Fixed)"
      - symbol: "$N_{\\min}$"
        code_variable: "\\texttt{N\\_MIN}"
        description: "Minimum chromosome number in the state space."
        value_source: "22 (Fixed)"
      - symbol: "$N_{\\max}$"
        code_variable: "\\texttt{N\\_MAX}"
        description: "Maximum chromosome number in the state space."
        value_source: "154 (Fixed)"
      - symbol: "$R$"
        code_variable: "\\texttt{R}"
        description: "Base growth rate parameter."
        value_source: "1.0 (Fixed)"
      - symbol: "$\\eta$"
        code_variable: "\\texttt{eta}"
        description: "Metabolic cost parameter penalizing high ploidy states."
        value_source: "Optimized"
      - symbol: "$K$"
        code_variable: "\\texttt{K}"
        description: "Carrying capacity for the population."
        value_source: "Derived"
  - title: "\\textit{Missegregation \\& Mutation}"
    rows:
      - symbol: "$p_{\\text{mis}}$"
        code_variable: "\\texttt{pmis\\_O2\\_0}"
        description: "Chromosome missegregation rate."
        value_source: "Optimized"
      - symbol: "$\\mu_{0}$"
        code_variable: "\\texttt{mr\\_lethality0}"
        description: "Missegregation lethality parameter (Pre-WGD)."
        value_source: "Optimized"
      - symbol: "$\\mu_{1}$"
        code_variable: "\\texttt{mr\\_lethality1}"
        description: "Missegregation lethality parameter (Post-WGD)."
        value_source: "Optimized"
  - title: "\\textit{Simulation Control}"
    rows:
      - symbol: "$dt$"
        code_variable: "\\texttt{DT}"
        description: "Integration time step for the Euler method."
        value_source: "Config"
  - title: "\\textit{Drug-Delay Transit Chain (in vivo)}"
    rows:
      - symbol: "\\textcolor{blue}{$n_{\\text{tr}}$}"
        code_variable: "\\texttt{n\\_tr}"
        description: "\\textcolor{blue}{Number of transit-chain stages (distributed delay to death). Carried over from the in-vitro gemcitabine fit.}"
        value_source: "\\textcolor{blue}{5 (in vitro)}"
      - symbol: "\\textcolor{blue}{$k_{\\text{tr}}(N)$}"
        code_variable: "\\texttt{k\\_tr}"
        description: "\\textcolor{blue}{Ploidy-dependent transit rate. Anchored on the in-vitro 2N/4N estimates and interpolated to arbitrary $N$ via $\\log\\tau(N)=b_0+b_1\\log(N/N_{2N})$, $k_{\\text{tr}}(N)=n_{\\text{tr}}/\\tau(N)$.}"
        value_source: "\\textcolor{blue}{$k_{\\text{tr},2N}=6.84$, $k_{\\text{tr},4N}=2.82$ day$^{-1}$ (in vitro)}"
      - symbol: "$k_{\\text{kill}}$"
        code_variable: "\\texttt{k\\_kill}"
        description: "Absolute in-vivo cytotoxic potency per unit delayed signal. \\emph{Not} transferred from in vitro; calibrated to in-vivo tumour-burden and ploidy data."
        value_source: "Optimized (in vivo)"

