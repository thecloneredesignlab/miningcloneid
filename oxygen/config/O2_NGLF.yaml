run_prefix: fit_invivo_model_O2_NGLF_MAP
append_run_prefix_timestamp: TRUE
run_prefix_timestamp_format: "%Y%m%d_%H%M%S"
out_root: ../results
data_dir: ../../data/InVivoData_Gemcitabine
seeds_file: ../data/O2_NGLF/seeds.csv
parameter_table: ../data/O2_NGLF/parameter_table.csv
auto_viz: TRUE
viz_report_dt: 1
viz_top_n: 6

# ------------------------------------------------------------------
# Estimated-Parameter Configuration (initial values / bounds / priors)
# ------------------------------------------------------------------
tau_O2: 1
tau_O2_init: 1
tau_O2_min: 0.001
tau_O2_max: 1000

o2_init_pct_init: 4.5
o2_init_pct_min: 0.3
o2_init_pct_max: 4.8
o2_rate_init: 1.0
o2_rate_min: 0.01
o2_rate_max: 3
o2_shape_v_init: 1.0
o2_shape_v_min: 0.7
o2_shape_v_max: 1.8

alpha_o2_init: 0.5
alpha_o2_min: 0.01
alpha_o2_max: 10
o2_ref_pct_init: 2.0
o2_ref_pct_min: 0.5
o2_ref_pct_max: 2.5
gamma_growth_init: 2.0
gamma_growth_min: 2.0
gamma_growth_max: 2.0
growth_penalty_ploidy: FALSE
growth_penalty_hypoxia: TRUE

death: TRUE
mu_hp_init: 0.001
mu_hp_min: 1.0e-8
mu_hp_max: 0.02
k_clear_init: 0.001
k_clear_min: 1.0e-8
k_clear_max: 1.0

use_soft_prior: TRUE
lambda_prior: 0.03
prior_center_log10_k_o: 1.69897
prior_sd_log10_k_o: 1.0
prior_center_log10_o2_rate: 0
prior_sd_log10_o2_rate: 1.0
prior_center_log10_o2_init_pct: 0.6532125
prior_sd_log10_o2_init_pct: 0.5
prior_center_log10_o2_shape_v: 0
prior_sd_log10_o2_shape_v: 0.5
prior_center_beta_size: 0.35
prior_sd_beta_size: 0.2
prior_center_log10_n_exp: 0
prior_sd_log10_n_exp: 0.5
prior_center_log10_rho_2N: 4.626668957
prior_sd_log10_rho_2N: 0.35
prior_center_log10_mu_hp: -3
prior_sd_log10_mu_hp: 1.0
prior_center_log10_k_clear: -3
prior_sd_log10_k_clear: 1.0

# -------------------------------------
# Fixed Model/Optimizer Data Parameters
# -------------------------------------
n_cores: 9
use_deoptim: TRUE
deoptim_parallel: TRUE
fit_treatment: FALSE
dose_zero_only: TRUE
paired_only: TRUE
truncate_at_treatment: FALSE
ploidy_at_harvest: TRUE

itermax: 220
NP: 256
n_starts: 80
optim_maxit: 15000
de_init_mode: hybrid
de_init_uniform_frac: 0.5
de_init_sigma_frac: 0.1
de_reltol: 1e-3
de_steptol: 25
optim_trace: TRUE
optim_trace_every: 1
trace_obj: FALSE
predict_n_cores: 1
max_scenarios: Inf

N_UNIT: 22
N_MIN: 22
N_MAX: 154
dt: 0.5
o2_burden_feedback: TRUE
o2_logn_eps: 1.0
o2_cache_bin_pct: 0.01
o2_cache_hysteresis_pct: 0.005
o2_cache_profile: FALSE
o2_curve_type: glogistic
o2_cap_pct: 5
o2_anchor_N: 1000000

K: 1e12
crowding: logistic
init_total_size: 1e6
dose_ref: 30
tx_mult_min: 0.05
min_pop: 1e-12

sigma_burden: 0.35
sigma_burden_min: 0.05
sigma_burden_max: 1.0
sigma_ploidy: 0.18
burden_log_eps: 1e-12
burden_exclude_day0: TRUE
rho_2N_min: 32000
rho_2N_max: 56000
