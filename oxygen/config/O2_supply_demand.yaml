run_prefix: fit_invivo_model_O2_supply_demand_MAP
append_run_prefix_timestamp: TRUE
run_prefix_timestamp_format: "%Y%m%d_%H%M%S"
out_root: ../results
data_dir: ../../data/InVivoData_Gemcitabine
seeds_file: ../data/O2_supply_demand/seeds.csv
parameter_table: ../data/O2_supply_demand/parameter_table.csv

auto_viz: TRUE
viz_report_dt: 1
viz_top_n: 6

fit_tau_O2: FALSE
tau_O2: 0.1
fit_treatment: FALSE
dose_zero_only: TRUE
paired_only: TRUE
truncate_at_treatment: FALSE
ploidy_at_harvest: TRUE

# Active growth/death parameters (always on in model/fitter).
alpha_o2_init: 1.5
alpha_o2_min: 0.5
alpha_o2_max: 4.0
gamma_growth_init: 3.0
gamma_growth_min: 1.5
gamma_growth_max: 4.5
mu_hp_init: 0.0015
mu_hp_min: 1.0e-5
mu_hp_max: 0.008
gamma_mu_init: 2.0
gamma_mu_min: 1.2
gamma_mu_max: 3.5
# ploidy_O2_death allowed values:
#   uniform        -> mu_eff = mu_hp * h(O2)
#   diploid_NULL   -> mu_eff = mu_hp * h(O2) * max(N/44 - 1, 0)^gamma_mu
#   ploidy_related -> mu_eff = mu_hp * h(O2) * (N/44)^gamma_mu
ploidy_O2_death: ploidy_related
k_clear_init: 1.0e-4
k_clear_min: 1.0e-5
k_clear_max: 5.0e-4

use_soft_prior: TRUE
lambda_prior: 0.03
prior_center_log10_k_o: 0.300000
prior_sd_log10_k_o: 0.60
prior_center_log10_kappa_O: -0.301030
prior_sd_log10_kappa_O: 0.50
prior_center_log10_o2_S0: 0.380211
prior_sd_log10_o2_S0: 0.20
prior_center_log10_eta_o2: 0.079181
prior_sd_log10_eta_o2: 0.20
prior_center_beta_size: 0.35
prior_sd_beta_size: 0.50
prior_center_log10_gamma_loss: -0.698970
prior_sd_log10_gamma_loss: 0.40
prior_center_log10_rho_2N: 4.626668957
prior_sd_log10_rho_2N: 0.15
prior_center_log10_mu_hp: -2.823909
prior_sd_log10_mu_hp: 0.35
prior_center_gamma_mu: 2.0
prior_sd_gamma_mu: 0.5
prior_center_log10_k_clear: -4.0
prior_sd_log10_k_clear: 0.35

n_cores: 9
use_deoptim: TRUE
deoptim_parallel: TRUE
itermax: 220
NP: 256
n_starts: 80
optim_maxit: 15000
de_init_mode: hybrid
de_init_uniform_frac: 0.35
de_init_sigma_frac: 0.08
de_reltol: 1e-3
de_steptol: 25
optim_trace: TRUE
optim_trace_every: 1
trace_obj: FALSE
predict_n_cores: 1
max_scenarios: Inf

N_UNIT: 22
N_MIN: 22
N_MAX: 154
dt: 0.05
o2_burden_feedback: TRUE
o2_cache_bin_pct: 0.01
o2_cache_hysteresis_pct: 0.005
o2_cache_profile: FALSE
o2_cap_pct: 5
o2_Nref: 1e6
lam_min_init: 0.05
lam_min_min: 0.02
lam_min_max: 0.20
delta_lam_init: -1.2
delta_lam_min: -3.0
delta_lam_max: -0.2
# Missegregation parameterization:
# p_mis_base = fixed baseline per-chromosome missegregation probability (not estimated).
# p_misseg  = stress-linked amplification scale (estimated).
p_mis_base: 1.0e-5
p_mis_base_init: 1.0e-5
p_misseg_init: 0.020
p_misseg_min: 0.005
p_misseg_max: 0.035
k_o_mis_init: 0.003
k_o_mis_min: 5.0e-4
k_o_mis_max: 0.020
p_wgd_init: 2.0e-4
p_wgd_min: 1.0e-6
p_wgd_max: 5.0e-4

K: 1e12
crowding: logistic
init_total_size: 1e6
dose_ref: 30
tx_mult_min: 0.05
min_pop: 1e-12

sigma_burden: 0.20
sigma_burden_min: 0.10
sigma_burden_max: 0.60
sigma_ploidy: 0.12
burden_log_eps: 1e-12
burden_exclude_day0: TRUE
rho_2N_min: 32000
rho_2N_max: 56000

o2_S0_init: 2.5
o2_S0_min: 2.1
o2_S0_max: 3.4
kappa_O_init: 0.45
kappa_O_min: 0.15
kappa_O_max: 0.90
eta_o2_init: 1.5
eta_o2_min: 1.1
eta_o2_max: 3.0
gamma_loss_init: 0.35
gamma_loss_min: 0.08
gamma_loss_max: 3.0
