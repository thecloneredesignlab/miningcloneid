# Standalone in-vitro O2 supply-demand configuration.
#
# Estimated biological and observation parameters remain in the in-vitro CSV
# parameter table. This file controls structural simulation choices and fixed
# likelihood settings for --fit_invitro only.

config_version: 1
fit_mode: fit_invitro

# Run the post-fit simulation, diagnostics, visualization, and report pipeline.
auto_viz: TRUE

# In-vitro cultures use externally assigned oxygen concentrations.
fixed_oxygen: TRUE
o2_burden_feedback: FALSE
O2_growth: TRUE

# Disable density-dependent division in standalone in-vitro fits. `crowding`
# remains explicit so the law is reproducible if Crowding is enabled later.
Crowding: FALSE
crowding: logistic
K: 1.0e12

# Chromosome-count state space and numerical integration.
start_with: chr_number
N_UNIT: 22
N_MIN: 22
N_MAX: 154
dt: 0.05
init_total_size: 1.0e6
min_pop: 1.0e-12

# Oxygen and treatment-independent runtime scales.
o2_min: 0
o2_Nref: 1.0e6
o2_S0_upper_bound: 21
o2_cache_profile: FALSE
dose_ref: 30
tx_mult_min: 0.05
fit_treatment: FALSE
burden_log_eps: 1.0e-12
ploidy_O2_death: ploidy_related

# Standalone in-vitro likelihood settings. Explicit CLI values override these
# defaults without changing the YAML snapshot.
invitro_death_weight: 1.0
invitro_ploidy_weight: 1.0
invitro_sigma_death_logit: 0.75
invitro_death_fraction_eps: 0.0001

invitro_passage_time_weight: 0.25
invitro_passage_time_tolerance_days: 1.0
invitro_passage_time_sigma_days: 1.0
invitro_passage_time_df: 4.0

invitro_buffer_prior_weight: 0.0
invitro_buffer_prior_center_smax: 0.98
invitro_buffer_prior_sd_smax: 0.10
invitro_buffer_prior_center_log10_beta: -0.154901959985743
invitro_buffer_prior_sd_log10_beta: 0.30
invitro_buffer_prior_center_log10_n_exp: 0.698970004336019
invitro_buffer_prior_sd_log10_n_exp: 0.30
